<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Media Wallpaper</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background image layer (user-uploaded, draggable) -->
    <div id="background-layer"></div>

    <!-- Background video layer (user-uploaded) -->
    <video id="background-video" loop muted playsinline style="display: none;"></video>

    <!-- Animated topographic contour lines overlay -->
    <canvas id="topo-canvas"></canvas>

    <!-- Optional overlay image (PNG) -->
    <div id="overlay-container">
        <img id="overlay-image" src="" alt="">
    </div>

    <!-- Main content layout -->
    <div class="layout-container">
        <!-- Top spacer for vertical centering -->
        <div class="top-spacer"></div>

        <!-- Clock Section -->
        <div class="clock-section glass-card">
            <div class="clock-wrapper">
                <!-- Chromatic aberration layers -->
                <span id="time-red" class="time-layer time-red" aria-hidden="true">00:00</span>
                <span id="time-green" class="time-layer time-green" aria-hidden="true">00:00</span>
                <span id="time-blue" class="time-layer time-blue" aria-hidden="true">00:00</span>
                <span id="time" class="time-layer time-main">00:00</span>
            </div>
            <div id="date-text">Sunday, May 03</div>
        </div>
        
        <!-- Weather Section -->
        <div class="weather-section glass-card" id="weather-section">
            <div class="weather-info">
                <div class="weather-main">
                    <span id="weather-temp">--°</span>
                    <div id="weather-icon-container"></div>
                </div>
                <div class="weather-sub">
                    <span id="weather-city">Loading...</span>
                    <span id="weather-desc">--</span>
                </div>
            </div>
        </div>

        <!-- Music Player Section -->
        <div class="music-section glass-card">
            <div class="album-art-container">
                <img id="album-art" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%231a1a2e'/><circle cx='150' cy='150' r='40' fill='none' stroke='%23334' stroke-width='2'/><circle cx='150' cy='150' r='60' fill='none' stroke='%23334' stroke-width='1'/><circle cx='150' cy='150' r='80' fill='none' stroke='%23334' stroke-width='1'/></svg>" alt="Album Art">
            </div>
            <div class="track-info">
                <h2 id="track-title">No Track Playing</h2>
                <p id="track-artist">Waiting for media...</p>
            </div>
            <!-- Music Progress Bar -->
            <div class="progress-container">
                <span id="time-current" class="progress-time">0:00</span>
                <div class="progress-bar-wrapper">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
                <span id="time-total" class="progress-time">0:00</span>
            </div>
        </div>

        <!-- Lyrics Section -->
        <div class="lyrics-section glass-card" id="lyrics-section">
            <div id="lyrics-content">Searching for lyrics...</div>
        </div>

        <!-- Spotify Next Song Section -->
        <div class="next-song-section glass-card" id="next-song-section">
            <div class="next-song-header">UP NEXT</div>
            <div class="next-song-content">
                <img id="next-album-art" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%231a1a2e'/></svg>" alt="Next Art">
                <div class="next-track-info">
                    <h3 id="next-track-title">Loading...</h3>
                    <p id="next-track-artist">Waiting for queue</p>
                </div>
            </div>
        </div>

        <!-- Hardware Stats Section -->
        <div class="stats-section glass-card" id="stats-section">
            <div class="stat-row">
                <div class="stat-item circle-item">
                    <svg class="circle-chart" viewBox="0 0 100 100">
                        <circle class="circle-bg" cx="50" cy="50" r="42"></circle>
                        <circle class="circle-progress" id="cpu-circle" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"></circle>
                    </svg>
                    <div class="circle-content">
                        <span class="stat-label">Ryzen 5 9600X</span>
                        <span class="stat-value" id="cpu-usage">--%</span>
                        <span class="stat-temp" id="cpu-temp">--°C</span>
                    </div>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item circle-item">
                    <svg class="circle-chart" viewBox="0 0 100 100">
                        <circle class="circle-bg" cx="50" cy="50" r="42"></circle>
                        <circle class="circle-progress" id="gpu-circle" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"></circle>
                    </svg>
                    <div class="circle-content">
                        <span class="stat-label">RTX 5070</span>
                        <span class="stat-value" id="gpu-usage">--%</span>
                        <span class="stat-temp" id="gpu-temp">--°C</span>
                        <div class="gpu-fan-container" style="display: none; position: absolute;">
                            <img src="assets/gpu_fan.png" id="gpu-fan" class="gpu-fan">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Claude Usage Section -->
        <div class="claude-section glass-card" id="claude-section">
            <div class="claude-header">CLAUDE LIMITS</div>
            <div class="claude-bar-row">
                <div class="claude-bar-top">
                    <span class="claude-bar-label">Session (5h)</span>
                    <span class="claude-bar-value" id="claude-session-pct">--%</span>
                </div>
                <div class="claude-bar-wrapper">
                    <div class="claude-bar-fill" id="claude-session-bar"></div>
                </div>
                <span class="claude-bar-reset" id="claude-session-reset">&nbsp;</span>
            </div>
            <div class="claude-bar-row">
                <div class="claude-bar-top">
                    <span class="claude-bar-label">Weekly</span>
                    <span class="claude-bar-value" id="claude-weekly-pct">--%</span>
                </div>
                <div class="claude-bar-wrapper">
                    <div class="claude-bar-fill" id="claude-weekly-bar"></div>
                </div>
                <span class="claude-bar-reset" id="claude-weekly-reset">&nbsp;</span>
            </div>
            <div class="claude-bar-row" id="claude-opus-row" style="display: none;">
                <div class="claude-bar-top">
                    <span class="claude-bar-label">Weekly (Opus)</span>
                    <span class="claude-bar-value" id="claude-opus-pct">--%</span>
                </div>
                <div class="claude-bar-wrapper">
                    <div class="claude-bar-fill" id="claude-opus-bar"></div>
                </div>
                <span class="claude-bar-reset" id="claude-opus-reset">&nbsp;</span>
            </div>
            <div class="claude-status" id="claude-status" style="display: none;"></div>
        </div>

        <!-- Bottom spacer -->
        <div class="bottom-spacer"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
